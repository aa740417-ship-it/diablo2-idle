<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>放置天堂 - 仿正服版載入中</title>
</head>
<body style="background:#020617;color:#e2e8f0;font-family:sans-serif;padding:24px">
    <div id="official-loading">仿正服版載入中…</div>

    <script>
    // ===== 仿正服版獨立儲存空間 =====
    // 所有 localStorage key 自動加上固定前綴。
    // 原版 index.html 仍使用原始 key；official.html 使用 lineage_official::key。
    (function installOfficialStorageNamespace() {
        const PREFIX = 'lineage_official::';
        window.OFFICIAL_BALANCE_MODE = true;
        window.OFFICIAL_STORAGE_PREFIX = PREFIX;

        if (window.__officialStoragePatched) return;
        window.__officialStoragePatched = true;

        const ls = window.localStorage;
        const proto = Storage.prototype;
        const rawGet = proto.getItem;
        const rawSet = proto.setItem;
        const rawRemove = proto.removeItem;
        const rawClear = proto.clear;
        const rawKey = proto.key;

        function scopedKey(key) {
            return PREFIX + String(key);
        }

        proto.getItem = function(key) {
            if (this === ls) return rawGet.call(this, scopedKey(key));
            return rawGet.call(this, key);
        };

        proto.setItem = function(key, value) {
            if (this === ls) return rawSet.call(this, scopedKey(key), value);
            return rawSet.call(this, key, value);
        };

        proto.removeItem = function(key) {
            if (this === ls) return rawRemove.call(this, scopedKey(key));
            return rawRemove.call(this, key);
        };

        // 仿正服版若呼叫 clear()，只清除仿正服自己的資料，不會刪到原版。
        proto.clear = function() {
            if (this !== ls) return rawClear.call(this);

            const targets = [];
            for (let i = 0; i < this.length; i++) {
                const k = rawKey.call(this, i);
                if (k && k.startsWith(PREFIX)) targets.push(k);
            }
            targets.forEach(k => rawRemove.call(this, k));
        };

        // 若遊戲用 localStorage.key(n) 掃描資料，只讓它看到仿正服自己的鍵。
        proto.key = function(index) {
            if (this !== ls) return rawKey.call(this, index);

            const wanted = Number(index) || 0;
            let seen = 0;
            for (let i = 0; i < this.length; i++) {
                const k = rawKey.call(this, i);
                if (!k || !k.startsWith(PREFIX)) continue;
                if (seen === wanted) return k.slice(PREFIX.length);
                seen++;
            }
            return null;
        };

        console.info('[official-storage] namespace enabled:', PREFIX);
    })();

    (async function () {
        try {
            const res = await fetch('index.html?v=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('index.html 載入失敗：HTTP ' + res.status);

            let html = await res.text();

            // OB12-market-cache：只在仿正服版強制抓新版潘朵拉市場程式。
            html = html.replace(
                /js\/24-pandora-relic-market\.js(?:\?[^"'<>\s]*)?/g,
                'js/24-pandora-relic-market.js?v=OB12-market'
            );

            // OB61：掉寶核心加入所有 BOSS 龍鑽機率／每日上限，並同步隱藏已封鎖的遺物掉落清單。
            html = html.replace(
                /js\/05-kill-progression\.js(?:\?[^"'<>\s]*)?/g,
                'js/05-kill-progression.js?v=OB61-boss-diamond'
            );

            // OB48：試煉／NPC 兌換獎勵核心有仿正服條件式修正。
            html = html.replace(
                /js\/12-npc-quests\.js(?:\?[^"'<>\s]*)?/g,
                'js/12-npc-quests.js?v=OB48-trial-reward'
            );

            // OB50：製作祝福率核心加入仿正服條件式。
            html = html.replace(
                /js\/14-craft-pandora\.js(?:\?[^"'<>\s]*)?/g,
                'js/14-craft-pandora.js?v=OB50-craft-bless'
            );

            // OB61：gainItem 在仿正服戰鬥掉落上下文全面封鎖 relic 類遺物。
            html = html.replace(
                /js\/08-items-equip\.js(?:\?[^"'<>\s]*)?/g,
                'js/08-items-equip.js?v=OB61-no-relic-drop'
            );

            // OB52：寵物經驗分配核心加入仿正服共享池條件式。
            html = html.replace(
                /js\/22-pets\.js(?:\?[^"'<>\s]*)?/g,
                'js/22-pets.js?v=OB57-pet-revive-economy'
            );

            // OB60：傭兵核心加入仿正服 4 名上限（含隊長共 5 人），並保留既有試煉修正。
            html = html.replace(
                /js\/06-status-allies\.js(?:\?[^"'<>\s]*)?/g,
                'js/06-status-allies.js?v=OB60-party-cap'
            );

            // OB55：召喚控制戒指數量上限加入仿正服條件式。
            html = html.replace(
                /js\/23-summons\.js(?:\?[^"'<>\s]*)?/g,
                'js/23-summons.js?v=OB56-summon-proc'
            );

            // OB56：傭兵抽象召喚把本輪召喚數量交給proc正規化。
            html = html.replace(
                /js\/07-skills-cast\.js(?:\?[^"'<>\s]*)?/g,
                'js/07-skills-cast.js?v=OB56-summon-proc'
            );

            // OB58：統一魔法傷害係數加入仿正服 SP 權重平衡。
            html = html.replace(
                /js\/03-combat-core\.js(?:\?[^"'<>\s]*)?/g,
                'js/03-combat-core.js?v=OB59-class-balance'
            );

            // 在所有原版 JS 跑完後才載入仿正服平衡層；
            // 儲存隔離則已在上方先安裝，所以遊戲初始化讀到的就是獨立存檔。
            const inject =
                '<script src="js/official-balance.js?v=OB62-relic-shop-4slot"><\/script>';

            if (!html.includes('</body>')) {
                throw new Error('找不到 </body>，無法載入仿正服平衡層');
            }

            html = html.replace(
                '</body>',
                inject +
                '\n<script src="js/official-attr-scroll-shop.js?v=20260916-attrproc1"><\/script>' +
                '\n<script src="js/official-protect-scroll-shop.js?v=20260916-protect200k"><\/script>' +
                '\n<script src="js/official-wiki-sync.js?v=20260915-official-wiki-sets2"><\/script>' +
                '\n</body>'
            );

            document.open();
            document.write(html);
            document.close();
        } catch (err) {
            const el = document.getElementById('official-loading');
            if (el) {
                el.innerHTML =
                    '<b style="color:#fca5a5">仿正服版載入失敗</b><br><br>' +
                    String(err && err.message ? err.message : err);
            }
            console.error(err);
        }
    })();
    </script>
</body>
</html>
